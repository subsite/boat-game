name: Release

# Push a version tag to build a signed APK and publish it as a GitHub Release:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 7's Android project needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]} MINOR=${BASH_REMATCH[2]} PATCH=${BASH_REMATCH[3]}
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "MINOR and PATCH must be below 100 for the versionCode scheme" >&2
            exit 1
          fi
          # Each release must have a higher versionCode than the last.
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_ENV"

      - name: Decode and check signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned build" >&2
            exit 1
          fi
          # -i skips stray whitespace/line breaks picked up when pasting the secret.
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d -i > "$RUNNER_TEMP/release.jks"
          echo "Decoded keystore: $(stat -c %s "$RUNNER_TEMP/release.jks") bytes"
          # Fail fast (before the long build) if the keystore, password or alias is wrong.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env SIGNING_KEYSTORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" > /dev/null; then
            echo "Keystore check failed: re-create SIGNING_KEYSTORE_BASE64 (see README) and check the password and alias secrets" >&2
            exit 1
          fi

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      # android/ is gitignored, so generate it fresh and stamp the version in.
      - name: Generate Android project
        run: |
          npx cap add android
          # App icon and portrait-only orientation.
          scripts/patch-android.sh
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"
          grep -q "versionCode $VERSION_CODE" "$GRADLE" && grep -q "versionName \"$VERSION\"" "$GRADLE" || {
            echo "Could not set the version in $GRADLE" >&2
            exit 1
          }

      - name: Build and sign APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          (cd android && ./gradlew assembleRelease)
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "boatgame-$GITHUB_REF_NAME.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "boatgame-$GITHUB_REF_NAME.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "boatgame-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
